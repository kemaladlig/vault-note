<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The boot splash paints the brand mark, so start its fetch before anything else. -->
    <link rel="preload" as="image" href="/pwa-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <!-- Browser chrome tint; mirrors --background (index.css) per scheme. -->
    <meta name="theme-color" content="#f2f4f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1c21" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VaultNote" />
    <meta
      name="google-site-verification"
      content="Rf4YpN9c8y9JtlHPvL6s7d2Vj8R6FVuBTusBQrMkdvY"
    />
    <meta
      name="description"
      content="VaultNote — uçtan uca şifreli, sunucusuz not uygulaması. Notlarınız cihazınızda şifrelenir, yalnızca şifreli veri Google Drive'ınıza taşınır. End-to-end encrypted, serverless notes."
    />
    <title>VaultNote</title>
    <style>
      /* Paint the correct surface before the app bundle runs, so there is no
         blank/gray (or light) flash on first load. Keep in sync with --background. */
      html {
        background: #ffffff;
      }
      html.dark {
        background: #1a1c21;
      }

      /* Boot splash: the brand screen painted before the bundle runs. It is dismissed by
         shared/boot.ts once React has mounted, so the handover never shows a bare shell.
         Colors mirror --background / --muted-foreground (index.css). */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(165deg, #e7ecf4, #f2f4f9 55%);
        transition: opacity 220ms cubic-bezier(0.2, 0, 0, 1);
      }
      html.dark #boot-splash {
        background: linear-gradient(165deg, #101116, #16181e 55%);
      }
      #boot-splash.is-hiding {
        opacity: 0;
        /* The outgoing brand screen must never eat input aimed at the screen under it. */
        pointer-events: none;
      }
      /* The mark is drawn as-is: the asset carries its own tile shape and edge treatment.
         Entrance is short and transform/opacity-only so it never delays the handover. */
      #boot-splash img {
        width: 84px;
        height: 84px;
        user-select: none;
        animation: boot-mark 260ms cubic-bezier(0.2, 0, 0, 1) both;
      }
      #boot-splash span {
        font:
          500 17px/1 'Google Sans', Roboto, 'Helvetica Neue', system-ui, 'Segoe UI', sans-serif;
        letter-spacing: 0.01em;
        color: #5f6b7e;
        animation: boot-word 240ms cubic-bezier(0.2, 0, 0, 1) 110ms both;
      }
      @keyframes boot-mark {
        from {
          opacity: 0;
          transform: scale(0.92);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-word {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      html.dark #boot-splash span {
        color: #9aa4b5;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          transition: none;
        }
        #boot-splash img,
        #boot-splash span {
          animation: none;
        }
      }
    </style>
    <script>
      /* Apply persisted theme + scale + accent + editor prefs before first paint. Keys mirror
         shared/theme.ts, shared/scale.ts, shared/accent.ts and shared/editorPrefs.ts;
         kept inline on purpose so it runs with zero dependencies. */
      ;(function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('vaultnote.theme')
          var dark =
            theme === 'dark' ||
            ((theme === 'system' || !theme) &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          var scale = localStorage.getItem('vaultnote.scale')
          root.style.fontSize = (scale === 'compact' ? 15 : scale === 'comfortable' ? 19 : 17) + 'px'
          var accent = localStorage.getItem('vaultnote.accent')
          if (accent && accent !== 'blue') root.setAttribute('data-accent', accent)
          var delta = Number(localStorage.getItem('vaultnote.editorDelta') ?? 0)
          if (Number.isFinite(delta) && delta !== 0) {
            delta = Math.min(6, Math.max(-3, Math.round(delta)))
            root.style.setProperty('--editor-delta', delta + 'px')
          }
          var line = localStorage.getItem('vaultnote.editorLine')
          root.style.setProperty(
            '--editor-line-height',
            line === 'compact' ? '1.55' : line === 'relaxed' ? '2' : '1.75',
          )
          if (localStorage.getItem('vaultnote.editorWidth') === 'wide') {
            root.style.setProperty('--editor-measure', '100%')
          }
        } catch (e) {
          /* localStorage unavailable — fall back to the CSS defaults. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img src="/pwa-192.png" alt="" width="168" height="168" />
      <span>VaultNote</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
